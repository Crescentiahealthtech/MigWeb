<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Ledger · CresRx</title>
<style>
  :root { --ink:#1b2430; --mute:#5b6675; --line:#e3e7ec; --bg:#f6f8fa; --card:#fff; --brand:#0b6e6e; --warn:#a15c00; --bad:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1 1 auto; }
  .tag { font-size:12px; color:var(--brand); border:1px solid var(--brand); border-radius:999px; padding:1px 8px; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:12px; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--mute); gap:4px; }
  input, select, button { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  button { cursor:pointer; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-width:110px; }
  .stat b { display:block; font-size:20px; }
  .stat span { font-size:12px; color:var(--mute); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--mute); font-weight:600; background:#fbfcfd; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .st { font-size:12px; border-radius:999px; padding:1px 8px; background:#eef2f6; white-space:nowrap; }
  .st.Completed { background:#e6f4ea; } .st.Cancelled { background:#fdecea; } .st.Arrived, .st.In-Progress { background:#fff4e0; }
  .msg { padding:12px; border-radius:8px; background:#fff; border:1px solid var(--line); margin:12px 0; }
  .msg.err { border-color:#f3c2bd; color:var(--bad); }
  .foot { font-size:12px; color:var(--mute); margin-top:10px; }
  .wrap { overflow-x:auto; }
  #signin { max-width:420px; margin:12vh auto; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Appointment Ledger <span class="tag">Supabase pilot · read-only</span></h1>
  <span id="who" class="foot"></span>
  <button id="out" hidden>Sign out</button>
</header>

<section id="signin" hidden>
  <h2 style="margin-top:0">Sign in</h2>
  <p class="foot">With the Google account registered on the Users sheet. This page reads the Supabase copy; bookings and status changes stay in the main app.</p>
  <button id="google" class="primary">Sign in with Google</button>
  <p id="signinMsg" class="foot"></p>
</section>

<main id="app" hidden>
  <div class="bar">
    <label>Date <input type="date" id="date"></label>
    <label>Doctor <select id="doctor"><option value="">All I may see</option></select></label>
    <button id="load" class="primary">Load</button>
    <button id="prev" title="Previous day">‹</button><button id="next" title="Next day">›</button>
  </div>
  <div class="stats" id="stats"></div>
  <div id="note"></div>
  <div class="wrap"><table id="tbl" hidden>
    <thead><tr><th>Time</th><th>Patient</th><th>Age / Sex</th><th>Purpose</th><th>Doctor</th><th>Status</th><th class="num">Fee</th></tr></thead>
    <tbody></tbody>
  </table></div>
  <p class="foot" id="foot"></p>
</main>

<script src="/vendor/firebase-10.7.1/firebase-app-compat.js"></script>
<script src="/vendor/firebase-10.7.1/firebase-auth-compat.js"></script>
<script>
  // The clinic's Firebase project: the same one the Apps Script app signs in with (Auth.html).
  // These values are public by design; the Worker verifies every token it receives.
  firebase.initializeApp({
    apiKey: "AIzaSyC-uRchTlUosmi3kBSJmsUfp_j7777SueQ",
    authDomain: "cresrxdemo.firebaseapp.com",
    projectId: "cresrxdemo",
    appId: "1:708400752697:web:018544fc3288cacbb145e8"
  });
  const auth = firebase.auth();
  const $ = (id) => document.getElementById(id);
  const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };

  const todayIST = () => new Date(Date.now() + 330 * 60000).toISOString().slice(0, 10);
  const shift = (key, days) => { const d = new Date(key + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + days); return d.toISOString().slice(0, 10); };
  $('date').value = new URLSearchParams(location.search).get('date') || todayIST();

  $('google').onclick = () => {
    $('signinMsg').textContent = '';
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch((e) => { $('signinMsg').textContent = e.code === 'auth/unauthorized-domain'
        ? 'This address is not yet authorised in Firebase (Authentication → Settings → Authorized domains).' : e.message; });
  };
  $('out').onclick = () => auth.signOut();
  $('load').onclick = () => load();
  $('prev').onclick = () => { $('date').value = shift($('date').value, -1); load(); };
  $('next').onclick = () => { $('date').value = shift($('date').value, 1); load(); };
  $('doctor').onchange = () => load();
  $('date').onchange = () => load();

  auth.onAuthStateChanged((user) => {
    $('signin').hidden = !!user; $('app').hidden = !user; $('out').hidden = !user;
    $('who').textContent = user ? user.email : '';
    if (user) load();
  });

  let busy = 0;
  async function load() {
    const user = auth.currentUser; if (!user) return;
    const mine = ++busy, t0 = performance.now();
    $('note').replaceChildren(el('div', 'Loading…', 'msg'));
    try {
      const token = await user.getIdToken();
      const q = new URLSearchParams({ date: $('date').value, doctor: $('doctor').value });
      const res = await fetch('/api/ledger?' + q, { headers: { authorization: 'Bearer ' + token } });
      const body = await res.json();
      if (mine !== busy) return;
      if (!body.success) { $('tbl').hidden = true; $('stats').replaceChildren(); $('note').replaceChildren(el('div', body.message || 'Could not load.', 'msg err')); return; }
      render(body, Math.round(performance.now() - t0));
    } catch (e) {
      if (mine === busy) $('note').replaceChildren(el('div', 'Could not reach the server: ' + e.message, 'msg err'));
    }
  }

  function render(b, totalMs) {
    const sel = $('doctor'), keep = sel.value;
    if (sel.options.length <= 1 || sel.dataset.n !== String(b.doctors.length)) {
      sel.replaceChildren(el('option', 'All I may see'));
      sel.options[0].value = '';
      b.doctors.forEach((d) => { const o = el('option', d.name); o.value = d.doctorId; sel.appendChild(o); });
      sel.dataset.n = String(b.doctors.length);
      sel.value = keep;
    }
    const L = b.ledger, n = (s) => L.filter((r) => r.status === s).length;
    const fees = L.filter((r) => r.status !== 'Cancelled').reduce((t, r) => t + (r.fee || 0), 0);
    $('stats').replaceChildren(...[['Appointments', L.length], ['Waiting', n('Booked') + n('Arrived')],
      ['In progress', n('In-Progress')], ['Completed', n('Completed')], ['Cancelled', n('Cancelled')],
      ['Fees (₹)', fees.toLocaleString('en-IN')]].map(([k, v]) => { const s = el('div', undefined, 'stat'); s.append(el('b', String(v)), el('span', k)); return s; }));
    $('note').replaceChildren(...(b.message ? [el('div', b.message, 'msg')] : []));
    const tb = $('tbl').tBodies[0];
    tb.replaceChildren(...L.map((r) => {
      const tr = el('tr');
      tr.append(el('td', r.noSlot ? 'No slot' : r.time12),
                (() => { const td = el('td'); td.append(el('div', r.patientName), el('div', r.patientId, 'foot')); return td; })(),
                el('td', [r.age, r.sex].filter(Boolean).join(' / ')),
                el('td', r.purpose), el('td', r.doctorName),
                (() => { const td = el('td'); td.append(el('span', r.status, 'st ' + r.status)); return td; })(),
                el('td', r.fee ? r.fee.toLocaleString('en-IN') : '', 'num'));
      return tr;
    }));
    $('tbl').hidden = !L.length;
    const synced = b.syncedAt ? new Date(b.syncedAt).toLocaleTimeString('en-IN') : '—';
    $('foot').textContent = 'Signed in as ' + b.me.username + ' (' + b.me.role + '). Loaded in ' + totalMs +
      ' ms (server ' + b.serverMs + ' ms). Copy of the workbook last updated at ' + synced +
      '; bookings and status changes made in the main app appear here within about a minute.';
  }
</script>
</body>
</html>
